openapi: 3.1.0
info:
  title: OneImg API
  version: 1.0.0
  description: OneImg 图像托管服务开放接口文档。
servers:
  - url: /api/v1
tags:
  - name: Public
    description: 无需登录即可访问的公开接口
  - name: Authentication
    description: 账户认证与会话管理
  - name: Account
    description: 当前账户、Passkey 与个人访问令牌管理
  - name: Images
    description: 图片查询、上传、导入与标签关联
  - name: Tags
    description: 标签管理
  - name: Storage
    description: 存储桶与连接配置
  - name: Statistics
    description: 统计数据
  - name: Users
    description: 用户与权限管理
  - name: Settings
    description: 系统设置
paths:
  /public/config:
    get:
      operationId: getPublicConfig
      summary: 获取公开配置
      tags: [Public]
      security: []
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /public/images/random:
    get:
      operationId: getRandomImage
      summary: 获取随机图片
      tags: [Public]
      security: []
      description: 预留接口，当前返回 501 random_images_not_implemented。
      responses:
        '501': { $ref: '#/components/responses/ProblemResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /auth/login:
    post:
      operationId: login
      summary: 登录
      tags: [Authentication]
      security: []
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /auth/register:
    post:
      operationId: register
      summary: 注册账户
      tags: [Authentication]
      security: []
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /auth/passkeys/login/options:
    post:
      operationId: createPasskeyLoginOptions
      summary: 创建 Passkey 登录选项
      tags: [Authentication]
      security: []
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /auth/passkeys/login/verify:
    post:
      operationId: verifyPasskeyLogin
      summary: 验证 Passkey 登录
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me:
    get:
      operationId: getMe
      summary: 获取当前账户
      tags: [Account]
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    patch:
      operationId: updateMe
      summary: 更新当前账户
      tags: [Account]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMeRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/UpdatedAccountResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/passkeys:
    get:
      operationId: listPasskeys
      summary: 获取 Passkey 列表
      tags: [Account]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/passkeys/registration/options:
    post:
      operationId: createPasskeyRegistrationOptions
      summary: 创建 Passkey 注册选项
      tags: [Account]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PasskeyManagement' }
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/passkeys/registration/verify:
    post:
      operationId: verifyPasskeyRegistration
      summary: 验证 Passkey 注册
      tags: [Account]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '201': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/passkeys/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    patch:
      operationId: renamePasskey
      summary: 重命名 Passkey
      tags: [Account]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/passkeys/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: revokePasskey
      summary: 撤销 Passkey
      tags: [Account]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PasswordConfirmation' }
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/avatar:
    put:
      operationId: updateMyAvatar
      summary: 上传或替换当前账户头像
      description: 只接受浏览器会话。服务器把 JPEG、PNG、GIF、WebP 静态图居中裁成 256×256 并重新编码为 WebP，原图最大 10 MiB，不计入存储配额。
      tags: [Account]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '503': { $ref: '#/components/responses/ImageProcessingBusyResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: deleteMyAvatar
      summary: 移除当前账户头像
      tags: [Account]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/tokens:
    get:
      operationId: listPersonalTokens
      summary: 获取个人访问令牌列表
      tags: [Account]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/TokenCollectionResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    post:
      operationId: createPersonalToken
      summary: 创建个人访问令牌
      tags: [Account]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTokenRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/CreatedTokenResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /me/tokens/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: revokePersonalToken
      summary: 撤销个人访问令牌
      tags: [Account]
      security: [{ cookieAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /upload-options:
    get:
      operationId: getUploadOptions
      summary: 获取上传选项
      tags: [Images]
      responses:
        '200': { $ref: '#/components/responses/UploadOptionsResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /image-storages:
    get:
      operationId: listImageStorages
      summary: 获取媒体所在存储
      description: |
        返回当前用户可见媒体实际引用的存储名称，管理员包含全部媒体，普通用户仅含自己的媒体。
        已停用、容量已满或当前无上传权限的存储同样返回，用于图库显示与筛选；可上传的存储请使用 /upload-options。
      tags: [Images]
      responses:
        '200': { $ref: '#/components/responses/ImageStorageCollectionResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /images:
    get:
      operationId: listImages
      summary: 获取图片和视频列表
      tags: [Images]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
        - name: q
          in: query
          description: "首尾空白移除后按 NFC + Unicode case fold + NFC 进行包含匹配；不去重音或兼容折叠。% 匹配任意字符序列，_ 匹配归一化后一个字符，反斜杠按字面值匹配。"
          schema: { type: string }
        - { name: bucket_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: tag_ids, in: query, description: 以逗号分隔的正整数 ID, schema: { type: string } }
        - { name: untagged, in: query, schema: { type: boolean } }
        - { name: uploader_role, in: query, schema: { type: integer, enum: [1, 3] } }
        - { name: media_type, in: query, description: 不传返回全部，历史空 MIME 记录归为图片, schema: { type: string, enum: [image, video] } }
      responses:
        '200': { $ref: '#/components/responses/ImageCollectionResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    post:
      operationId: uploadImages
      summary: 上传图片或已启用的 MP4/WebM 视频
      description: |
        每个文件独立返回成功或失败，批量结果仍为 HTTP 200。
        新增图片只接受真实 JPEG/PNG/GIF/WebP，拒绝 SVG 及伪装内容。
        默认图像预算为 40000000 像素、单边 16384；服务器可降低预算。
        忙碌时文件返回 image_processing_busy，客户端应稍后手动重试，不无限自动重试。
        目标存储已停用时整批返回 409 storage_disabled。
      tags: [Images]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: binary } }
                tag_ids: { type: array, items: { type: integer, minimum: 1 } }
                bucket_id: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/UploadBatchResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /images/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getImage
      summary: 获取图片详情
      tags: [Images]
      responses:
        '200': { $ref: '#/components/responses/ImageResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: deleteImage
      summary: 删除图片
      tags: [Images]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /image-imports:
    post:
      operationId: importImage
      summary: 导入远程图片
      description: 无效格式或超出图像预算返回 422；目标存储已停用返回 409 storage_disabled；处理繁忙返回 503 和 Retry-After，客户端应稍后重试。
      tags: [Images]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImageImportRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/ImageResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '422': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ImageProcessingBusyResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /images/{image_id}/tags/{tag_id}:
    parameters:
      - { $ref: '#/components/parameters/ImageID' }
      - { $ref: '#/components/parameters/TagID' }
    put:
      operationId: addImageTag
      summary: 添加图片标签
      tags: [Images]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: removeImageTag
      summary: 移除图片标签
      tags: [Images]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /images/tags:
    patch:
      operationId: updateImageTags
      summary: 批量更新图片标签
      tags: [Images]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchImageTagsRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /tags:
    get:
      operationId: listTags
      summary: 获取标签列表
      description: 返回全部标签；count 为标签在当前用户可见文件中的使用次数，管理员统计全部文件，普通用户只统计自己的文件。
      tags: [Tags]
      responses:
        '200': { $ref: '#/components/responses/TagCollectionResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    post:
      operationId: createTag
      summary: 创建标签
      tags: [Tags]
      requestBody: { $ref: '#/components/requestBodies/Tag' }
      responses:
        '201': { $ref: '#/components/responses/TagResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /tags/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    patch:
      operationId: updateTag
      summary: 更新标签
      tags: [Tags]
      requestBody: { $ref: '#/components/requestBodies/Tag' }
      responses:
        '200': { $ref: '#/components/responses/TagResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: deleteTag
      summary: 删除标签
      tags: [Tags]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /storage-buckets:
    get:
      operationId: listStorageBuckets
      summary: 获取存储桶列表
      tags: [Storage]
      responses:
        '200': { $ref: '#/components/responses/StorageBucketCollectionResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    post:
      operationId: createStorageBucket
      summary: 创建存储桶
      tags: [Storage]
      requestBody: { $ref: '#/components/requestBodies/Storage' }
      responses:
        '201': { $ref: '#/components/responses/StorageBucketResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /storage-buckets/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getStorageBucket
      summary: 获取存储桶详情
      tags: [Storage]
      responses:
        '200': { $ref: '#/components/responses/StorageBucketResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    patch:
      operationId: updateStorageBucket
      summary: 更新存储桶
      description: |
        更换端点或账户时必须显式提供新凭证，否则返回 422 credentials_required_for_new_endpoint。
        config 只需包含要修改的字段；只修改 public_domain 不需要重新提供凭证，传空字符串表示清除。
      tags: [Storage]
      requestBody: { $ref: '#/components/requestBodies/Storage' }
      responses:
        '200': { $ref: '#/components/responses/StorageBucketResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: deleteStorageBucket
      summary: 删除存储桶
      description: |
        删除存储桶的图片记录、标签关联及所有用户对该存储的授权，外链随之失效；操作不可撤销。
        默认保留远端物理文件；仅当 purge_objects=true 时才删除其中未被其他记录引用的物理文件。
        只想停止新上传、保留外链时应使用停用接口。
        id 为 1 的本地存储返回 403 default_storage_protected；当前系统默认存储返回 409 storage_is_upload_default，需先切换默认存储。
        物理文件删除失败返回 502 storage_delete_failed，存储桶和数据库记录保留。
      tags: [Storage]
      parameters:
        - { name: purge_objects, in: query, description: 为 true 时同时删除远端物理文件；省略或 false 时保留, schema: { type: boolean, default: false } }
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /storage-buckets/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: disableStorageBucket
      summary: 停用存储桶
      description: |
        停用后不接受新上传或导入，也不出现在上传选项中；已有记录、外链、授权和物理文件保持不变，可随时启用。
        id 为 1 的本地存储返回 403 default_storage_protected；当前系统默认存储返回 409 storage_is_upload_default。
      tags: [Storage]
      responses:
        '200': { $ref: '#/components/responses/StorageBucketResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /storage-buckets/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: enableStorageBucket
      summary: 启用存储桶
      tags: [Storage]
      responses:
        '200': { $ref: '#/components/responses/StorageBucketResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /storage-connection-tests:
    post:
      operationId: testStorageConnection
      summary: 测试存储连接
      description: |
        提供已有 id 必须具有 storage:update 权限，越权在使用已有秘密及联网之前返回 403 permission_denied。
        无 id 时使用显式提供的新配置。更换端点或账户但未提供新凭证返回 422 credentials_required_for_new_endpoint。
      tags: [Storage]
      requestBody: { $ref: '#/components/requestBodies/Storage' }
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '422': { $ref: '#/components/responses/ProblemResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /stats/dashboard:
    get:
      operationId: getDashboardStats
      summary: 获取仪表盘统计
      tags: [Statistics]
      responses:
        '200': { $ref: '#/components/responses/DashboardStatsResponse' }
        '500': { $ref: '#/components/responses/StatsReadFailedResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /stats/images:
    get:
      operationId: getImageStats
      summary: 获取图片统计
      tags: [Statistics]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [day, week, month, year], default: month } }
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        '500': { $ref: '#/components/responses/StatsReadFailedResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /users:
    get:
      operationId: listUsers
      summary: 获取用户列表
      tags: [Users]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
        - { name: id, in: query, schema: { type: integer, minimum: 1 } }
        - name: username
          in: query
          description: "搜索与图库 q 使用相同 Unicode 忽略大小写及 %、_ 通配符规则；反斜杠为字面值。登录和用户名唯一性不变。"
          schema: { type: string }
        - { name: role, in: query, schema: { type: integer, enum: [1, 3] } }
      responses:
        '200': { $ref: '#/components/responses/UserCollectionResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    post:
      operationId: createUser
      summary: 创建用户
      tags: [Users]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /users/{id}/avatar:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - { name: v, in: query, required: false, schema: { type: string }, description: 头像版本；与当前版本一致时响应可长期缓存 }
    get:
      operationId: getUserAvatar
      summary: 读取用户头像
      description: 可以读取自己的头像；读取他人头像需要 users:read scope 和 user:list 权限。地址取自用户信息中的 avatar_url。
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/AvatarImageResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    patch:
      operationId: updateUser
      summary: 更新用户
      tags: [Users]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { username: { type: string }, role: { type: integer, enum: [1, 3] } } } } }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: deleteUser
      summary: 删除用户
      tags: [Users]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /users/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: updateUserPermissions
      summary: 更新用户权限
      tags: [Users]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Permission' } } }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /users/{id}/password-reset:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: resetUserPassword
      summary: 重置用户密码
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /users/{id}/passkeys/revoke:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: revokeUserPasskeys
      summary: 撤销用户的 Passkey
      tags: [Users]
      responses:
        '204': { $ref: '#/components/responses/NoContentResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
  /settings:
    get:
      operationId: getSettings
      summary: 获取系统设置
      tags: [Settings]
      parameters:
        - { name: groups, in: query, description: 以逗号分隔的设置分组, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
    patch:
      operationId: updateSettings
      summary: 更新系统设置
      description: 一次请求可以修改多个字段，在同一个事务中保存：任一字段无效时整体回滚，返回 422，errors[].field 是出错的字段名（与请求体字段一致，如 main_image_quality、default_storage），errors[].code 一般为 invalid，默认存储已停用时为 storage_disabled。图片直链域名已移到各 S3/R2 存储的 config.public_domain；请求里仍带 public_image_domain 时返回 422 validation_error，errors[].code 为 moved。
      tags: [Settings]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } }
      responses:
        '200': { $ref: '#/components/responses/DataResponse' }
        default: { $ref: '#/components/responses/ProblemResponse' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: oneimg-session }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ImageID: { name: image_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    TagID: { name: tag_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Sort: { name: sort, in: query, schema: { type: string } }
    Order: { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
  requestBodies:
    Login:
      required: true
      content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string, format: password } } } } }
    PasswordConfirmation:
      required: true
      content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password } } } } }
    PasskeyManagement:
      required: true
      content: { application/json: { schema: { type: object, required: [name, current_password], properties: { name: { type: string }, current_password: { type: string, format: password } } } } }
    Tag:
      required: true
      content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 10 } } } } }
    Storage:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/StorageRequest' } } }
  responses:
    StatsReadFailedResponse:
      description: 数据库统计查询失败，返回 stats_read_failed，不返回全零成功响应
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UpdatedAccountResponse:
      description: 账户已更新，需要重新登录；改密会撤销全部会话与个人令牌
      headers: { X-Request-ID: { schema: { type: string } } }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [user, reauthentication_required]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  reauthentication_required: { type: boolean }
    UploadOptionsResponse:
      headers: { X-Request-ID: { schema: { type: string } } }
      description: 实际允许的文件类型、分类大小限制和可用存储
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/UploadOptions' }
    ProblemResponse:
      description: RFC 9457 问题详情
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ImageProcessingBusyResponse:
      description: image_processing_busy，图像处理繁忙
      headers:
        X-Request-ID: { schema: { type: string } }
        Retry-After: { schema: { type: integer, minimum: 1 }, description: 重试前至少等待的秒数 }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    DataResponse:
      description: 请求成功
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } }
    NoContentResponse:
      description: 请求成功，无响应内容
      headers: { X-Request-ID: { schema: { type: string } } }
    UserResponse:
      description: 用户信息
      headers: { X-Request-ID: { schema: { type: string } }, Location: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/User' } } } } }
    AvatarImageResponse:
      description: 256×256 WebP 头像
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { image/webp: { schema: { type: string, format: binary } } }
    UserCollectionResponse:
      description: 分页用户列表
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } }, meta: { $ref: '#/components/schemas/Meta' } } } } }
    ImageResponse:
      description: 图片信息
      headers: { X-Request-ID: { schema: { type: string } }, Location: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Image' } } } } }
    ImageCollectionResponse:
      description: 分页图片列表
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/Image' } }, meta: { $ref: '#/components/schemas/Meta' } } } } }
    ImageStorageCollectionResponse:
      description: 媒体所在存储列表
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ImageStorage' } } } } } }
    TagResponse:
      description: 标签信息
      headers: { X-Request-ID: { schema: { type: string } }, Location: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Tag' } } } } }
    TagCollectionResponse:
      description: 标签列表
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/TagUsage' } } } } } }
    StorageBucketResponse:
      description: 存储桶信息
      headers: { X-Request-ID: { schema: { type: string } }, Location: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StorageBucket' } } } } }
    StorageBucketCollectionResponse:
      description: 存储桶列表
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/StorageBucket' } } } } } }
    DashboardStatsResponse:
      description: 仪表盘统计
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/DashboardStats' } } } } }
    UploadBatchResponse:
      description: 按文件返回的批量上传结果
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UploadBatch' } } } } }
    TokenCollectionResponse:
      description: 个人访问令牌列表
      headers: { X-Request-ID: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/PersonalAccessToken' } } } } } }
    CreatedTokenResponse:
      description: 新建的个人访问令牌，明文仅返回一次
      headers: { X-Request-ID: { schema: { type: string } }, Location: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/CreatedPersonalAccessToken' } } } } }
  schemas:
    DataEnvelope:
      type: object
      required: [data]
      properties: { data: {}, meta: { $ref: '#/components/schemas/Meta' } }
    Meta:
      type: object
      properties:
        pagination:
          type: object
          required: [page, page_size, total, total_pages]
          properties: { page: { type: integer }, page_size: { type: integer }, total: { type: integer, format: int64 }, total_pages: { type: integer, format: int64 } }
    FieldProblem:
      type: object
      required: [field, code, message]
      properties: { field: { type: string }, code: { type: string }, message: { type: string } }
    Problem:
      type: object
      required: [type, title, status, detail, code, instance, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldProblem' } }
    Permission:
      type: object
      required: [codes, bucket_ids]
      properties: { codes: { type: array, items: { type: string } }, bucket_ids: { type: array, items: { type: integer, minimum: 1 } } }
    User:
      type: object
      required: [id, username, avatar_url, role, permission, created_at, updated_at, password_change_required, bootstrap_verification_required]
      properties:
        id: { type: integer }
        username: { type: string }
        avatar_url: { type: [string, 'null'], description: 头像地址（相对于站点根路径），未上传时为 null }
        role: { type: integer, enum: [1, 3] }
        permission: { $ref: '#/components/schemas/Permission' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        password_change_required: { type: boolean }
        bootstrap_verification_required: { type: boolean, description: 改密需要服务器本地一次性校验码 }
    ManagedUser:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - { type: object, required: [passkey_count], properties: { passkey_count: { type: integer, format: int64, minimum: 0 } } }
    Tag:
      type: object
      required: [id, name]
      properties: { id: { type: integer }, name: { type: string } }
    TagUsage:
      type: object
      required: [id, name, count]
      properties:
        id: { type: integer }
        name: { type: string }
        count: { type: integer, format: int64, minimum: 0, description: 当前用户可见文件中带有该标签的数量 }
    Image:
      type: object
      required: [id, url, thumbnail, file_name, original_file_name, original_file_size, file_size, mime_type, width, height, storage, bucket_id, user_id, uploader_role, tags, created_at]
      properties:
        id: { type: integer }
        url: { type: string }
        thumbnail: { type: string }
        file_name: { type: string }
        original_file_name: { type: string }
        original_file_size: { type: integer, format: int64 }
        file_size: { type: integer, format: int64 }
        mime_type: { type: string }
        width: { type: integer }
        height: { type: integer }
        storage: { type: string }
        bucket_id: { type: integer }
        user_id: { type: integer }
        uploader_role: { type: integer }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        created_at: { type: string, format: date-time }
    TrendPoint:
      type: object
      required: [date, count, image_count, video_count]
      properties: { date: { type: string }, count: { type: integer, format: int64, minimum: 0 }, image_count: { type: integer, format: int64, minimum: 0 }, video_count: { type: integer, format: int64, minimum: 0 } }
    FormatStats:
      type: object
      required: [format, count, size]
      properties: { format: { type: string }, count: { type: integer, format: int64, minimum: 0 }, size: { type: integer, format: int64, minimum: 0 } }
    SizeStats:
      type: object
      required: [range, count]
      properties: { range: { type: string }, count: { type: integer, format: int64, minimum: 0 } }
    DashboardStats:
      type: object
      required: [total_images, total_videos, image_size, video_size, today_image_uploads, today_video_uploads, month_image_uploads, month_video_uploads, total_size, today_uploads, month_uploads, recent_images, upload_trend, format_stats, size_distribution]
      properties:
        total_images: { type: integer, format: int64, minimum: 0, description: 仅图片数量，历史空 MIME 记录归为图片 }
        total_videos: { type: integer, format: int64, minimum: 0 }
        image_size: { type: integer, format: int64, minimum: 0 }
        video_size: { type: integer, format: int64, minimum: 0 }
        today_image_uploads: { type: integer, format: int64, minimum: 0 }
        today_video_uploads: { type: integer, format: int64, minimum: 0 }
        month_image_uploads: { type: integer, format: int64, minimum: 0 }
        month_video_uploads: { type: integer, format: int64, minimum: 0 }
        total_size: { type: integer, format: int64, minimum: 0, description: 图片主文件与视频原文件大小合计，不包含缩略图 }
        today_uploads: { type: integer, format: int64, minimum: 0 }
        month_uploads: { type: integer, format: int64, minimum: 0 }
        recent_images: { type: array, items: { $ref: '#/components/schemas/Image' } }
        upload_trend: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } }
        format_stats: { type: array, items: { $ref: '#/components/schemas/FormatStats' } }
        size_distribution: { type: array, items: { $ref: '#/components/schemas/SizeStats' } }
    StorageBucket:
      type: object
      required: [id, name, type, capacity_bytes, usage_bytes, usage_exact, disabled]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [default, s3, r2, ftp, webdav] }
        capacity_bytes: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, description: OneImg 配置的逻辑配额，0 表示无限制 }
        usage_bytes: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, description: OneImg 管理的主图和已成功保存的缩略图占用 }
        usage_exact: { type: boolean, description: false 表示 usage_bytes 包含历史数据的保守估算 }
        filesystem: { $ref: '#/components/schemas/StorageFilesystem' }
        config: { $ref: '#/components/schemas/StorageConfig' }
        disabled: { type: boolean, description: true 表示已停用，不接受新上传且不出现在上传选项中，已有媒体照常读取 }
    StorageConfig:
      type: object
      additionalProperties: true
      description: 按存储类型使用不同字段（如 r2_endpoint、ftp_host）；密钥类字段在响应中为空字符串，并附带 <字段>_configured 表示是否已配置。
      properties:
        public_domain:
          type: string
          description: |
            仅 S3 / R2：存储桶的公开访问域名（直链域名），只缺协议时补 https://，保存时去掉末尾 /。设置后该存储全部文件（含历史文件和缩略图）的返回链接改用这个域名，浏览器不经过 OneImg，来源白名单不生效。
            留空表示经 OneImg 访问。格式错误或其他存储类型返回 422 validation_error，errors[].field 为 config.public_domain。
    ImageStorage:
      type: object
      required: [id, name, type, disabled]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        disabled: { type: boolean, description: true 表示已停用，已有媒体照常读取 }
    StorageFilesystem:
      type: object
      description: 默认本地存储 uploads 所在文件系统的容量信息
      required: [total_bytes, used_bytes, available_bytes]
      properties:
        total_bytes: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        available_bytes: { type: integer, format: int64, minimum: 0 }
    PersonalAccessToken:
      type: object
      required: [id, name, prefix, scopes, expires_at, last_used_at, revoked_at, created_at]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    CreatedPersonalAccessToken:
      type: object
      required: [token, record]
      properties:
        token: { type: string, pattern: '^oneimg_pat_[A-Za-z0-9_-]+_[A-Za-z0-9_-]+$' }
        record: { $ref: '#/components/schemas/PersonalAccessToken' }
    UploadFileResult:
      type: object
      required: [file_name, success]
      properties:
        file_name: { type: string }
        success: { type: boolean }
        duplicate: { type: boolean }
        image: { $ref: '#/components/schemas/Image' }
        error:
          type: object
          required: [code, detail]
          properties:
            code:
              type: string
              description: |
                包含 unsupported_image_format、image_dimensions_exceeded、image_processing_busy、
                storage_object_conflict、file_too_large、file_upload_failed 及其他文件级错误。
            detail: { type: string }
    UploadBatch:
      type: object
      required: [files, summary]
      properties:
        files: { type: array, items: { $ref: '#/components/schemas/UploadFileResult' } }
        summary:
          type: object
          required: [total, succeeded, failed]
          properties:
            total: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
    UpdateMeRequest:
      type: object
      required: [current_password]
      properties: { current_password: { type: string, format: password }, username: { type: string }, password: { type: string, format: password }, bootstrap_code: { type: string, description: 旧默认密码管理员恢复时必填的本地一次性码 } }
    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 50 }
        scopes: { type: array, minItems: 1, items: { type: string, enum: ['images:read', 'images:write', 'images:delete', 'tags:read', 'tags:write', 'storage:read', 'storage:write', 'users:read', 'users:write', 'settings:read', 'settings:write', 'stats:read'] } }
        expiration_days: { type: [integer, 'null'], enum: [0, 30, 90, 365, null], default: 90 }
        current_password: { type: string, format: password, deprecated: true, description: 为兼容旧客户端保留，服务端不再校验此字段 }
    ImageImportRequest:
      type: object
      required: [url]
      properties: { url: { type: string, format: uri }, bucket_id: { type: integer, minimum: 1 }, tag_ids: { type: array, items: { type: integer, minimum: 1 } } }
    BatchImageTagsRequest:
      type: object
      required: [image_ids]
      properties: { image_ids: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }, add_tag_ids: { type: array, items: { type: integer, minimum: 1 } }, remove_tag_ids: { type: array, items: { type: integer, minimum: 1 } } }
    StorageRequest:
      type: object
      required: [name, type, capacity_bytes, config]
      properties: { id: { type: integer, minimum: 1 }, name: { type: string }, type: { type: string, enum: [default, s3, r2, ftp, webdav] }, capacity_bytes: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, description: OneImg 配置的逻辑配额，0 表示无限制；超出 int64 返回 422 validation_error }, config: { $ref: '#/components/schemas/StorageConfig' } }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties: { username: { type: string, minLength: 3, maxLength: 50 }, password: { type: string, minLength: 6, maxLength: 100 }, role: { type: integer, enum: [1, 3] } }
    UploadOptions:
      type: object
      required: [video_upload_enabled, max_video_file_size, max_file_size, allowed_types, max_files, default_storage, storage_buckets]
      properties:
        video_upload_enabled: { type: boolean }
        max_video_file_size: { type: integer }
        max_file_size: { type: integer, description: 图片单文件字节上限 }
        allowed_types: { type: array, items: { type: string }, description: 实际允许的图片与视频 MIME 类型 }
        max_files: { type: integer }
        default_storage: { type: integer }
        storage_buckets: { type: array, items: { type: object, additionalProperties: true } }
    SettingsPatch:
      type: object
      additionalProperties: false
      properties:
        original_image: { type: boolean }
        save_webp: { type: boolean }
        thumbnail: { type: boolean }
        registration_enabled: { type: boolean }
        save_original_name: { type: boolean }
        default_storage: { type: integer, minimum: 1, description: 必须是已存在且未停用的存储，指向已停用存储返回 422 storage_disabled }
        max_file_size: { type: integer, description: 图片单文件字节上限 }
        video_upload_enabled: { type: boolean, default: false }
        max_video_file_size: { type: integer, minimum: 1048576, maximum: 1073741824, default: 104857600 }
        allowed_types: { type: string, description: 逗号分隔的图片 MIME 类型，视频通过独立开关启用 }
        main_image_quality: { type: integer }
        skip_compress_formats: { type: string }
        default_path:
          type: string
          description: |
            存储路径模板，留空时使用 uploads/{year}/{month}。可用变量 {year} {month} {day} {hour} {minute} {second} {role} {random} {uuid} {filename}，{moon} 为 {month} 的旧写法，变量区分大小写。
            修改时不能包含空格、控制字符、\、. 或 .. 目录、不成对的花括号或不支持的变量，否则返回 422 validation_error，errors[].field 为 default_path；未修改的已保存值不重新校验。
            本地存储的文件始终写在 uploads 目录下，路径不以 uploads 开头时自动补上；远端存储按原样作为对象前缀。
        file_name:
          type: string
          description: |
            文件名模板，留空、{random} 或 {uuid} 时只使用随机 ID；其他模板生成「名字-随机ID.扩展名」。可用变量同 default_path。
            修改时不能包含控制字符、不成对的花括号或不支持的变量，否则返回 422 validation_error，errors[].field 为 file_name。
        cdn_domain: { type: string, description: 本地存储的 CDN 域名，CDN 根路径指向 uploads 目录，返回链接去掉 /uploads 前缀；留空表示经 OneImg 访问 }
        referer_white_enable: { type: boolean }
        referer_white_list: { type: string }
        seo_title: { type: string }
        seo_description: { type: string }
        seo_keywords: { type: string }
        seo_icp: { type: string }
        public_security: { type: string }
        seo_icon: { type: string }
security:
  - cookieAuth: []
  - bearerAuth: []
